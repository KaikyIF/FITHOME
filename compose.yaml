services:
  # O banco fica na rede interna do Docker e persiste em um volume.
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fithome
      MYSQL_USER: fithome_app
      MYSQL_PASSWORD: ${FITHOME_DB_PASSWORD:-fithome_dev_password}
      MYSQL_ROOT_PASSWORD: ${FITHOME_DB_ROOT_PASSWORD:-fithome_dev_root}
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./sql/01_fithome_mysql.sql:/docker-entrypoint-initdb.d/01_fithome_mysql.sql:ro
      - ./sql/02_cadastro.sql:/docker-entrypoint-initdb.d/02_cadastro.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 4s
      retries: 40
  # A API aguarda o banco e publica apenas a porta HTTP.
  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: fithome
      DB_USER: fithome_app
      DB_PASSWORD: ${FITHOME_DB_PASSWORD:-fithome_dev_password}
    ports:
      - "${FITHOME_BIND:-127.0.0.1}:${FITHOME_PORT:-8088}:80"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dados_mysql:
